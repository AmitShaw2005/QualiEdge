services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qualiedge-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data

  frontend:
    image: node:20-alpine
    container_name: qualiedge-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped
